# Production additions for the Vultr server. Used together with ../docker-compose.yml:
#   COMPOSE_FILE=docker-compose.yml:deploy/docker-compose.prod.yml   (set in .env on the server)
#
# Adds Caddy (automatic HTTPS) in front of n8n. ai-worker and mock-api stay private
# (bound to 127.0.0.1 in the base file); n8n reaches them over the internal Docker network.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - n8n
    environment:
      N8N_DOMAIN: ${N8N_DOMAIN:?set N8N_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env (for Let's Encrypt expiry notices)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro   # path is relative to the automation/ folder
      - caddy_data:/data
      - caddy_config:/config

  n8n:
    environment:
      N8N_HOST: ${N8N_DOMAIN}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_DOMAIN}/
      N8N_SECURE_COOKIE: "true"
      N8N_PROXY_HOPS: "1"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"

volumes:
  caddy_data:
  caddy_config:
